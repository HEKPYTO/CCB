name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        run: test "v$(PYTHONPATH=src python3 -c 'import ccb; print(ccb.__version__)')" = "${{ inputs.tag || github.ref_name }}"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: |
          python3 -m venv /tmp/ccb-verify
          /tmp/ccb-verify/bin/pip install dist/*.whl
          /tmp/ccb-verify/bin/ccb version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
