[project]
name = "certified-corruption-budget"
description = "Anytime-valid leaderboard claims with a certified corruption budget"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zoonyanapat" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/HEKPYTO/CERTIFIED-CORRUPTION-BUDGET"
Repository = "https://github.com/HEKPYTO/CERTIFIED-CORRUPTION-BUDGET"

[project.scripts]
ccb = "ccb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ccb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccb"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "ccb/schema"

[tool.hatch.build.targets.sdist]
include = ["/src", "/schema", "/README.md", "/pyproject.toml"]

[dependency-groups]
dev = ["jsonschema", "pytest", "ruff", "pre-commit"]

[tool.pytest.ini_options]
markers = [
  "slow: statistical validity tests",
  "performance: benchmark tests",
]
addopts = "-m 'not slow and not performance'"
