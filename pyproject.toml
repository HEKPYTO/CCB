[project]
name = "certified-corruption-budget"
description = "Anytime-valid leaderboard claims with a certified corruption budget"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
dynamic = ["version"]

[project.scripts]
ccb = "ccb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ccb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccb"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[tool.pytest.ini_options]
markers = [
  "slow: statistical validity tests",
  "performance: benchmark tests",
]
addopts = "-m 'not slow and not performance'"
